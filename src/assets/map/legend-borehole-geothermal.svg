<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!-- Schatten getrennt von der Form: Safari rastert SVG-Filter mit einfacher Auflösung, die Form bleibt so auch auf Retina scharf -->
<use xlink:href="#shape" filter="url(#shadow)"/>
<use xlink:href="#shape"/>
<defs>
<clipPath id="inside">
<rect x="15" y="5.10059" width="14" height="14" rx="1" transform="rotate(45 15 5.10059)"/>
</clipPath>
<g id="shape">
<rect x="15" y="5.10059" width="14" height="14" rx="1" transform="rotate(45 15 5.10059)" fill="#E53940"/>
<g clip-path="url(#inside)">
<rect x="15" y="5.10059" width="14" height="14" rx="1" transform="rotate(45 15 5.10059)" stroke="#801519" stroke-width="4"/>
</g>
</g>
<filter id="shadow" x="0.514648" y="2.51489" width="28.9707" height="28.9705" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix"/>
<feMorphology radius="1" operator="erode" in="SourceAlpha" result="effect1_dropShadow"/>
<feOffset dy="2"/>
<feGaussianBlur stdDeviation="3"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.898039 0 0 0 0 0.223529 0 0 0 0 0.25098 0 0 0 0.4 0"/>
<feBlend mode="normal" in2="BackgroundImageFix" result="effect1_dropShadow"/>
</filter>
</defs>
</svg>
